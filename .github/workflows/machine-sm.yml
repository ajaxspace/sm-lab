# SM kicker stub (lab shape): reconciles THIS repo from the patched pack
# branch — thin wrapper, no awf factory involved.
name: 'Machine SM (lab)'
run-name: '🧹 SM tick ${{ github.event_name }}'
on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Log the plan, perform no action'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: write
jobs:
  sm:
    runs-on: ubuntu-slim
    concurrency:
      group: machine-sm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pack (fix branch)
        uses: actions/checkout@v4
        with:
          repository: IstiN/dmtools-agents
          ref: fix/io-cache-ttl
          path: agents
      - name: Install dmtools CLI
        run: |
          curl -fsSL --connect-timeout 15 --max-time 45 \
            "https://github.com/epam/dmtools-dart/releases/download/v0.1.103/install.sh" \
            -o /tmp/dmtools-install.sh
          DMTOOLS_GITHUB_TOKEN=${{ github.token }} bash /tmp/dmtools-install.sh v0.1.103
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"
      - name: Reconcile the machine loop
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          CHECKS_GH_TOKEN: ${{ github.token }}
          SILENT_GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY: ${{ inputs.dryRun || 'false' }}
        run: |
          cd agents
          OVERRIDE=$(jq -n --arg repo "$GH_REPO" --arg tok "$SILENT_GH_TOKEN" --argjson dry "$DRY" \
            '{params:{jobParams:{repo:$repo, dryRun:$dry, machineAuthor:"ajaxspace",
             ciWorkflow:"ci.yml", validationChecks:"[\"lab-validation\"]",
             silentToken:$tok, checksToken:$tok}}}')
          dmtools run sm_github.json "$OVERRIDE"
